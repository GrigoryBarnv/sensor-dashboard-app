<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sensor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Anmelden</h3>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="matrikelnummer" class="form-label">Matrikelnummer</label>
                                <input type="text" class="form-control" id="matrikelnummer" name="matrikelnummer" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Passwort</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Anmelden</button>
                            </div>
                        </form>
                        <hr>
                        <div class="text-center">
                            <p>Noch kein Konto? <a href="#" id="showRegister">Registrieren</a></p>
                        </div>
                    </div>
                </div>

                <!-- Registration Form (initially hidden) -->
                <div class="card mt-3" id="registerCard" style="display: none;">
                    <div class="card-header">
                        <h3 class="text-center">Registrieren</h3>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="regMatrikelnummer" class="form-label">Matrikelnummer</label>
                                <input type="text" class="form-control" id="regMatrikelnummer" name="matrikelnummer" required>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Passwort</label>
                                <input type="password" class="form-control" id="regPassword" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Passwort bestätigen</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Registrieren</button>
                            </div>
                        </form>
                        <hr>
                        <div class="text-center">
                            <p>Bereits registriert? <a href="#" id="showLogin">Anmelden</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginCard = loginForm.closest('.card');
            const registerCard = document.getElementById('registerCard');
            const showRegisterLink = document.getElementById('showRegister');
            const showLoginLink = document.getElementById('showLogin');
            const toast = document.getElementById('toast');
            const bsToast = new bootstrap.Toast(toast);

            function showToast(title, message, isError = false) {
                const toastTitle = document.getElementById('toastTitle');
                const toastMessage = document.getElementById('toastMessage');
                const toastHeader = toast.querySelector('.toast-header');
                
                toastTitle.textContent = title;
                toastMessage.textContent = message;
                toastHeader.className = 'toast-header ' + (isError ? 'bg-danger text-white' : 'bg-success text-white');
                
                bsToast.show();
            }

            showRegisterLink.addEventListener('click', (e) => {
                e.preventDefault();
                loginCard.style.display = 'none';
                registerCard.style.display = 'block';
            });

            showLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                registerCard.style.display = 'none';
                loginCard.style.display = 'block';
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = {
                    matrikelnummer: document.getElementById('matrikelnummer').value,
                    password: document.getElementById('password').value
                };

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();
                    
                    if (response.ok) {
                        showToast('Erfolg', 'Login erfolgreich');
                        window.location.href = '/';  // Redirect to home page
                    } else {
                        showToast('Fehler', data.error || 'Login fehlgeschlagen', true);
                    }
                } catch (error) {
                    showToast('Fehler', 'Ein Fehler ist aufgetreten', true);
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    showToast('Fehler', 'Passwörter stimmen nicht überein', true);
                    return;
                }

                const formData = {
                    matrikelnummer: document.getElementById('regMatrikelnummer').value,
                    password: password
                };

                try {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();
                    
                    if (response.ok) {
                        showToast('Erfolg', 'Registrierung erfolgreich');
                        // Switch to login form
                        registerCard.style.display = 'none';
                        loginCard.style.display = 'block';
                        // Clear registration form
                        registerForm.reset();
                    } else {
                        showToast('Fehler', data.error || 'Registrierung fehlgeschlagen', true);
                    }
                } catch (error) {
                    showToast('Fehler', 'Ein Fehler ist aufgetreten', true);
                }
            });
        });
    </script>
</body>
</html>
